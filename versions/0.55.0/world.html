    <script>
      // A browser with no save takes the one the offline launcher keeps, if there is one.
      try {
        if (!localStorage.getItem('lumen.skills')) {
          const x = new XMLHttpRequest();
          x.open('GET', '/save-import.json', false);
          x.send();
          if (x.status === 200) for (const [k, v] of Object.entries(JSON.parse(x.responseText))) localStorage.setItem(k, v);
        }
        // A hero from before the Conquerors is laid to rest, whole, for a later part of the game.
        const old = JSON.parse(localStorage.getItem('lumen.skills') || '{}');
        if (Object.keys(old).length && !localStorage.getItem('lumen.conqueror')) {
          for (const key of Object.keys(localStorage)) {
            if (!key.startsWith('lumen.') || /^lumen\.(settings|old\.|legend\.)/.test(key)) continue;
            localStorage.setItem(`lumen.legend.${key.slice(6)}`, localStorage.getItem(key));
            localStorage.removeItem(key);
          }
          localStorage.setItem('lumen.skills', '{}');
        }
      } catch { /* no launcher here */ }
    </script>

      /* ===== War banner: the look of every HUD piece and menu (v0.41). Iron plates with brass trim and rivets,
         hanging cloth banners, a heraldic serif for names and numbers. Later rules here win over the older ones above. ===== */
      @font-face { font-family: 'Cinzel'; font-weight: 600; font-display: swap; src: url(/fonts/cinzel-latin-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Cinzel'; font-weight: 800; font-display: swap; src: url(/fonts/cinzel-latin-800-normal.woff2) format('woff2'); }
      :root {
        --ink: #120f14; --iron: #2a2420; --iron-hi: #3a322b; --edge: #8a7a62; --brass: #c8a050; --brass-hi: #f0d488;
        --cloth: #7a1a20; --parch: #ecdcbc; --parch-dim: #b8a684; --blood: #d23c3a; --spirit: #4ab8e0;
        --serif: 'Cinzel', 'Zen Maru Gothic', serif; --sans: 'Zen Maru Gothic', sans-serif;
        --rivets: radial-gradient(circle, #c8b088 1.4px, #3a2a1a 1.9px, transparent 2.3px);
        --plate: linear-gradient(#2f2924f2, #1b1715f2);
        --frame: inset 0 0 0 1px var(--edge), inset 0 0 0 2px #0009, 0 0 0 1px #000, 0 4px 12px #000a;
      }
      /* A plate: iron, a bronze edge, a rivet in each corner. */
      .compass, #foe, #p2-foe, #act:not(:empty), #p2-act:not(:empty), #menu-hints, #menu-place, #menu-side, .market-box {
        background: var(--rivets) left 3px top 3px / 8px 8px no-repeat, var(--rivets) right 3px top 3px / 8px 8px no-repeat,
          var(--rivets) left 3px bottom 3px / 8px 8px no-repeat, var(--rivets) right 3px bottom 3px / 8px 8px no-repeat, var(--plate);
        box-shadow: var(--frame);
      }

      /* ---- the hero's banner, hanging from the top-left: emblem, Omega numeral, phase, progress ---- */
      .omega { left: 14px; top: 0; width: 60px; height: 112px; display: block; gap: 0; letter-spacing: 0; text-transform: none; color: var(--parch); }
      .omega::before, .omega::after { content: ''; position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }
      .omega::before { background: linear-gradient(90deg, #8a6a2a, var(--brass-hi) 50%, #8a6a2a); filter: drop-shadow(0 4px 6px #000); }
      .omega::after { inset: 0 3px 3px; background: repeating-linear-gradient(0deg, #ffffff07 0 2px, transparent 2px 4px), linear-gradient(90deg, #0006, transparent 30%, transparent 70%, #0006), color-mix(in srgb, var(--hero, #9a2a2a) 52%, #1a080a); }
      .omega > * { position: relative; z-index: 1; }
      .omega em { display: flex; justify-content: center; margin-top: 12px; height: 30px; color: var(--brass-hi); filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 6px #0008); }
      .omega b { display: block; width: auto; height: auto; margin-top: 4px; background: none; text-align: center; font: 800 21px var(--serif); color: var(--c, var(--parch)); text-shadow: 0 2px 0 #000, 0 0 10px #000; }
      .omega span { display: block; text-align: center; font: 600 7.5px var(--serif); letter-spacing: 0.1em; text-transform: uppercase; color: var(--parch); text-shadow: 0 1px 0 #000; }
      .omega u { display: block; width: 36px; height: 3px; margin: 5px auto 0; background: #0009; box-shadow: 0 0 0 1px #0006; }
      .omega s { display: block; height: 100%; width: 0; background: var(--c, var(--brass)); text-decoration: none; }
      #p2-omega { left: 14px; right: auto; top: 50%; }
      body.two #p2-omega { left: 14px; top: 50%; }

      /* ---- name and level, health, Spirit, Wrath, the Conqueror's gauge, Structure ---- */
      #lv, #p2-lv { left: 86px; top: 9px; display: flex; align-items: baseline; gap: 10px; font: 600 15px var(--serif); color: var(--parch); text-shadow: 0 1px 0 #000, 0 0 8px #000c; }
      #lv b, #p2-lv b { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--parch); }
      #lv span, #p2-lv span { font-size: 13px; color: var(--brass-hi); }
      #hp, #p2-hp { left: 86px; top: 32px; width: 260px; height: 17px; padding: 3px; border-radius: 0; background: #0d0a09; box-shadow: var(--frame); clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
      #hp::after, #p2-hp::after { content: ''; position: absolute; inset: 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), #0000005a calc(10% - 1px) 10%); pointer-events: none; }
      #hp-fill, #p2-hp-fill { border-radius: 0; background: linear-gradient(#ff7a68, var(--blood) 45%, #8a1420); box-shadow: inset 0 1px 0 #ffffff55; }
      #p2-hp-fill { background: linear-gradient(#8af0d8, #2fa890 45%, #16604f); }
      #hp.low #hp-fill, #p2-hp.low #p2-hp-fill { animation: beat 0.9s ease-in-out infinite; }
      /* Rally: grey health right after the red, won back by hitting back (melee.js). */
      #hp .rally, #p2-hp .rally { position: absolute; top: 3px; bottom: 3px; left: calc(3px + (100% - 6px) * var(--hp, 1)); width: calc((100% - 6px) * var(--rally, 0)); background: linear-gradient(#fff1cf, #d8b878 55%, #8f7344); opacity: 0.8; box-shadow: inset 0 1px 0 #ffffff66; transition: left 0.2s, width 0.2s; pointer-events: none; }
      @keyframes beat { 50% { filter: brightness(1.7); } }
      #hurt-veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s; background: radial-gradient(ellipse at center, transparent 55%, #7a0a10b0 100%); }
      body.low-hp #hurt-veil { opacity: 1; animation: veil 0.9s ease-in-out infinite; }
      @keyframes veil { 50% { opacity: 0.55; } }
      body.title #hurt-veil, body.in-menu #hurt-veil, body.in-menu #foe, body.in-menu #p2-foe, body.title #foe { display: none; }
      .fight, #p2-fight { left: 86px; top: 56px; width: 252px; gap: 6px 10px; }
      .fight .pips { gap: 5px; }
      .fight .pips i { width: 22px; height: 9px; background: #0d0a09; box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #000; transform: skewX(-32deg); }
      .fight .pips b { background: linear-gradient(#d8f6ff, var(--spirit) 60%, #1a6a8a); }
      .fight .pips i.full { box-shadow: inset 0 0 0 1px #d8f6ff, 0 0 0 1px #000, 0 0 8px #4ab8e099; }
      .fight .post { width: 96px; height: 6px; background: #0d0a09; box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #000; }
      .fight .post u { background: linear-gradient(90deg, var(--brass), #ff6a3a); }
      .fight .wrath { height: 6px; background: #0d0a09; box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #000; }
      .fight .wrath u { background: linear-gradient(90deg, #6a1020, var(--blood), #ff8a4a); }
      .fight .wrath span, .fight .meter span { font: 600 10px var(--serif); letter-spacing: 0.08em; text-transform: uppercase; top: -3px; }
      .fight .wrath:not(.full):not(.surge) span { color: var(--parch-dim); }
      .fight .meter { height: 9px; border-radius: 0; background: #0d0a09; box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #000; }
      .fight .meter u { border-radius: 0; }
      .fight .meter i { background: var(--brass-hi); }
      #goal, #p2-goal { left: 16px; top: 124px; max-width: 360px; font: 600 14px var(--serif); text-shadow: 0 1px 0 #000, 0 0 8px #000; }
      #goal:not(:empty)::before { content: '◆ '; color: var(--brass); }
      body.two #p2-lv { top: calc(50% + 9px); left: 86px; }
      body.two #p2-hp { top: calc(50% + 32px); left: 86px; right: auto; }
      body.two #p2-fight { top: calc(50% + 56px); left: 86px; }
      body.two #p2-goal { top: calc(50% + 124px); left: 16px; }

      /* Narrow screens: a slimmer cluster and compass, so the two never meet. */
      @media (max-width: 1100px) {
        #hp, #p2-hp { width: 196px; } .fight, #p2-fight { width: 190px; } .fight .post { width: 70px; }
        .compass { width: clamp(180px, calc(100vw - 600px), 520px); }
        #toast, #p2-toast { padding: 6px 40px; top: 31%; }
        #foe, #p2-foe { top: 112px; width: 300px; } .army { top: 166px; width: 300px; }
      }
