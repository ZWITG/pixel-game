<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen World Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e17; }
      #game { position: fixed; inset: 0; }
      #where { position: fixed; left: 12px; top: 10px; color: #f3ead8; font: 13px monospace; text-shadow: 1px 1px 0 #141a28; pointer-events: none; }
      #help, #map-hints { position: fixed; bottom: 10px; color: #f3ead8; font: 500 14px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      #help { left: 12px; }
      #pad-status { position: fixed; right: 12px; top: 10px; color: #f3ead8; font: 500 14px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      #map-hints { right: 14px; }
      .glyph { display: inline-block; vertical-align: middle; margin: -2px 2px 0 0; }
      .key, .btn { display: inline-block; vertical-align: middle; margin: -2px 3px 0 0; padding: 2px 6px; font-size: 12px; line-height: 1.2; text-shadow: none; color: #141a28; background: #f3ead8; }
      .btn { background: #c9d4e2; border-radius: 8px; }
      #toast { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); max-width: calc(100% - 32px); color: #f3ead8; font: 700 20px 'Zen Maru Gothic', sans-serif; text-align: center; text-shadow: 0 2px 0 #141a28; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
      #toast.show { opacity: 1; }
      #toast.big { color: #ffb547; font-size: 30px; }
      #breath { position: fixed; left: 50%; bottom: 44px; width: 220px; height: 10px; transform: translateX(-50%); background: #141a28; }
      #breath-fill { height: 100%; width: 100%; background: #9fe8ff; }
      #blink { position: fixed; inset: 0; background: #141a28; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
      #blink.on { opacity: 1; transition: none; }
      #skills { position: fixed; inset: 0; background: #0a0f22; }
      #skill-map { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
      #skill-tag { position: fixed; left: 0; right: 0; bottom: 5%; text-align: center; font: 700 26px 'Zen Maru Gothic', sans-serif; text-shadow: 0 2px 0 #0a0f22; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="where"></div>
    <div id="pad-status"></div>
    <div id="help"></div>
    <div id="blink"></div>
    <div id="toast"></div>
    <div id="breath" hidden><div id="breath-fill"></div></div>
    <div id="skills" hidden>
      <canvas id="skill-map"></canvas>
      <div id="skill-tag"></div>
      <div id="map-hints"></div>
    </div>
    <script type="module" src="/src/open/main.js"></script>
  </body>
</html>
