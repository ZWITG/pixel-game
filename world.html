<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen World Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e17; }
      #game { position: fixed; inset: 0; }
      #where { position: fixed; left: 12px; top: 10px; color: #f3ead8; font: 13px monospace; text-shadow: 1px 1px 0 #141a28; pointer-events: none; }
      #help, #map-hints { position: fixed; bottom: 10px; color: #f3ead8; font: 500 14px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      #help { left: 12px; }
      #pad-status { position: fixed; right: 12px; top: 10px; color: #f3ead8; font: 500 14px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      #map-hints { right: 14px; }
      .glyph { display: inline-block; vertical-align: middle; margin: -2px 2px 0 0; }
      .key, .btn { display: inline-block; vertical-align: middle; margin: -2px 3px 0 0; padding: 2px 6px; font-size: 12px; line-height: 1.2; text-shadow: none; color: #141a28; background: #f3ead8; }
      .btn { background: #c9d4e2; border-radius: 8px; }
      #toast, #p2-toast { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); max-width: calc(100% - 32px); color: #f3ead8; font: 700 20px 'Zen Maru Gothic', sans-serif; text-align: center; text-shadow: 0 2px 0 #141a28; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
      #toast.show, #p2-toast.show { opacity: 1; }
      #toast.big, #p2-toast.big { color: #ffb547; font-size: 30px; }
      #p2-toast { top: 24%; color: #9fe8ff; }
      body.two #toast { top: 7%; }
      body.two #p2-toast { left: 50%; top: 57%; }
      body.two #act { bottom: calc(50% + 12px); }
      body.two #p2-act { left: 50%; bottom: 38px; }
      body.two #breath { bottom: calc(50% + 40px); }
      body.two #p2-breath { left: 50%; bottom: 66px; }
      body.two #p2-hp { left: 12px; right: auto; top: calc(50% + 10px); }
      body.two #p2-gains { left: auto; right: 14px; top: calc(50% + 12px); text-align: right; }
      body.two #p2-bag { bottom: 10px; }
      body.two #help { display: none; }
      body:not(.two) .p2 { display: none; }
      #gains, #p2-gains { position: fixed; right: 14px; top: 56px; text-align: right; font: 700 18px 'Zen Maru Gothic', sans-serif; text-shadow: 0 2px 0 #141a28; pointer-events: none; }
      #p2-gains { right: auto; left: 14px; text-align: left; }
      #gains div, #p2-gains div { animation: gain 2.6s forwards; }
      @keyframes gain { 0% { opacity: 0; transform: translateY(10px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
      #act, #p2-act { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); color: #f3ead8; font: 700 18px 'Zen Maru Gothic', sans-serif; text-shadow: 0 2px 0 #141a28; white-space: nowrap; pointer-events: none; }
      #p2-bag { position: fixed; right: 12px; bottom: 32px; color: #f3ead8; font: 700 15px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      body.two #bag { top: calc(50% - 28px); bottom: auto; }
      #p2-bag { bottom: 10px; }
      #bag { position: fixed; right: 12px; bottom: 10px; color: #f3ead8; font: 700 15px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; pointer-events: none; }
      #hp, #p2-hp { position: fixed; left: 12px; top: 32px; width: 200px; height: 10px; background: #141a28; }
      #p2-hp { left: auto; right: 12px; }
      #hp-fill, #p2-hp-fill { height: 100%; width: 100%; background: #ff6f6f; }
      #p2-hp-fill { background: #5fd8c0; }
      .float { position: fixed; transform: translateX(-50%); font: 700 18px 'Zen Maru Gothic', sans-serif; text-shadow: 0 2px 0 #141a28; pointer-events: none; animation: float 0.8s forwards; }
      @keyframes float { to { opacity: 0; margin-top: -30px; } }
      #breath, #p2-breath { position: fixed; left: 50%; bottom: 44px; width: 220px; height: 10px; transform: translateX(-50%); background: #141a28; }
      #breath-fill, #p2-breath-fill { height: 100%; width: 100%; background: #9fe8ff; }
      #blink { position: fixed; inset: 0; background: #141a28; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
      #blink.on { opacity: 1; transition: none; }
      #skills { position: fixed; inset: 0; background: #0a0f22; }
      #pack { position: fixed; inset: 0; background: #120d14; }
      #pack-page { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
      #pack-tag, #pack-info { position: fixed; left: 54%; right: 4%; text-align: center; color: #f3ead8; text-shadow: 0 2px 0 #120d14; }
      #pack-tag { top: 11%; font: 700 26px 'Zen Maru Gothic', sans-serif; color: #ffb547; }
      #pack-info { top: 18%; font: 500 16px 'Zen Maru Gothic', sans-serif; }
      #pack-hints { position: fixed; bottom: 10px; right: 14px; color: #f3ead8; font: 500 14px 'Zen Maru Gothic', sans-serif; text-shadow: 0 1px 0 #141a28; }
      #skill-map { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
      #skill-tag { position: fixed; left: 0; right: 0; bottom: 5%; text-align: center; font: 700 26px 'Zen Maru Gothic', sans-serif; text-shadow: 0 2px 0 #0a0f22; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="where"></div>
    <div id="p2-hp" class="p2"><div id="p2-hp-fill"></div></div>
    <div id="hp"><div id="hp-fill"></div></div>
    <div id="pad-status"></div>
    <div id="help"></div>
    <div id="blink"></div>
    <div id="toast"></div>
    <div id="gains"></div>
    <div id="act"></div>
    <div id="bag"></div>
    <div id="p2-toast" class="p2"></div>
    <div id="p2-gains" class="p2"></div>
    <div id="p2-act" class="p2"></div>
    <div id="p2-bag" class="p2"></div>
    <div id="p2-breath" class="p2" hidden><div id="p2-breath-fill"></div></div>
    <div id="breath" hidden><div id="breath-fill"></div></div>
    <div id="skills" hidden>
      <canvas id="skill-map"></canvas>
      <div id="skill-tag"></div>
      <div id="map-hints"></div>
    </div>
    <div id="pack" hidden>
      <canvas id="pack-page"></canvas>
      <div id="pack-tag"></div>
      <div id="pack-info"></div>
      <div id="pack-hints"></div>
    </div>
    <script type="module" src="/src/open/main.js"></script>
  </body>
</html>
