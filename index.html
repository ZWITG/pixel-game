<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="flash"></div>
      <div id="stats">
        <div id="hearts"></div>
        <div id="level"><span id="lv">Lv 1</span><div id="xpbar"><div id="xpfill"></div></div></div>
      </div>
      <div id="coins"><span id="coin-icon"></span><span id="coin-count">0</span></div>
      <div id="cam-hint"></div>
      <div id="banner"></div>
      <div id="prompt">E / A&nbsp; Talk</div>
      <div id="floats"></div>
      <div id="dialogue" class="panel" hidden>
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
        <div id="dlg-more">&#9660;</div>
      </div>
      <div id="shop" class="panel" hidden>
        <div class="shop-head"><span id="shop-title"></span><span id="shop-coins"></span></div>
        <ul id="shop-list"></ul>
        <div id="shop-desc"></div>
        <div id="shop-msg"></div>
        <div class="shop-hint">Up/Down choose &middot; E/A buy &middot; Q/B leave</div>
      </div>
      <div id="gameover" hidden>
        <div class="big">You fell...</div>
        <div>Press R / Start to rise again</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
